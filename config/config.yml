host: 0.0.0.0
port: 8080
agent_count: 3          # この人数が接続したらゲーム開始

# reveal_all   : 最後まで開示し、各エージェントの最速正解位置でスコア(1問1回・誤答ロックアウト)
# first_answer : 誰かが正解したら終了(誤答はロックアウトして続行)。競技寄り
# benchmark    : 誤答ロックアウト無し。毎トークン回答してよく、最速正解位置でスコア。
#                pass を使わない「常時回答型」(hayabusa-chick そのまま)が乗る
mode: reveal_all

judge: normalized_match  # 解答の正規化文字列一致
questions: data/questions.csv
response_timeout_ms: 30000
log_dir: logs            # ゲームログ(観戦イベントの JSONL)の保存先。空にすると保存しない

# agent_count 人そろうごとにゲームを1つ生成し、複数ゲームを並行実行する。
# 進行中のゲームは GET /games で一覧でき、観戦は ws /viewer?game=<id> で選ぶ。

# 任意のアクセストークン(空=認証なし)。設定すると:
#   agents(/ws)は player_token、観戦(/viewer, /games)は receiver_token を要求。
#   ブラウザは ?token=<t> で渡す(WebSocket はヘッダを付けられないため)。
# auth:
#   player_token: ""
#   receiver_token: ""
